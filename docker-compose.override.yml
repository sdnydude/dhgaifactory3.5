services:
  session-logger:
    build:
      context: services/session-logger
      dockerfile: Dockerfile
    container_name: dhg-session-logger
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-dhg}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-dhg_registry}
      - POSTGRES_HOST=registry-db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_URL=http://172.17.0.1:11434
      - SUMMARIZE_MODEL=${SUMMARIZE_MODEL:-qwen3:14b}
    ports:
      - "8009:8009"
    depends_on:
      registry-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8009"
      prometheus.io/path: "/metrics"
    networks:
      - dhg-network
    restart: unless-stopped

  dhg-logo-maker:
    build: ./services/logo-maker
    container_name: dhg-logo-maker
    ports:
      - "8012:8012"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - /mnt/4tb/dhg-storage/logo-maker:/mnt/4tb/dhg-storage/logo-maker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  registry-api:
    build:
      context: ./registry
      dockerfile: Dockerfile
    container_name: dhg-registry-api
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8000"
      prometheus.io/path: "/metrics"
    ports:
      - "8011:8000"
    environment:
      - POSTGRES_USER=dhg
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=dhg_registry
      - POSTGRES_HOST=registry-db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://dhg:${POSTGRES_PASSWORD}@registry-db:5432/dhg_registry
      - LANGGRAPH_API_URL=${LANGGRAPH_API_URL:-https://dhg-agents-526554f2bb905517adab9bd53427c745.us.langgraph.app}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - EXPORT_SIGNING_SECRET=${EXPORT_SIGNING_SECRET}
      - REGISTRY_WEBHOOK_SECRET=${REGISTRY_WEBHOOK_SECRET}
      - PDF_RENDERER_URL=http://dhg-pdf-renderer:8014
      - FRONTEND_INTERNAL_URL=http://dhg-frontend:3000
      - EXPORTS_DIR=/exports
      - OLLAMA_URL=${OLLAMA_URL:-http://dhg-ollama:11434}
      - TALKBACK_LOCAL_MODEL=${TALKBACK_LOCAL_MODEL:-qwen3:14b}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REGISTRY_WRITE_AUTH_MODE=${REGISTRY_WRITE_AUTH_MODE:-off}
      - LOGS_CHAT_TOKEN=${LOGS_CHAT_TOKEN:-}
      - LOGS_CHAT_MODEL=${LOGS_CHAT_MODEL:-granite4.1:8b}
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
      - REGISTRY_WRITE_TOKEN=${REGISTRY_WRITE_TOKEN:-}
    volumes:
      - dhg_exports:/exports:ro
    depends_on:
      registry-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dhg-network
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: dhg-prometheus
    group_add:
      - "125"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-remote-write-receiver'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dhg-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: dhg-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager:/etc/alertmanager
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dhg-network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.6
    container_name: dhg-loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki:/etc/loki
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    healthcheck:
      # Loki 3.x images ship no shell/wget — container-level probe impossible.
      # Liveness is monitored via the Prometheus loki scrape (up{job="loki"}).
      disable: true
    networks:
      - dhg-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: dhg-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dhg-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: dhg-node-exporter
    pid: host
    network_mode: host
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
      - '--collector.textfile.directory=/host/mnt/4tb/observability/textfile'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: dhg-cadvisor
    runtime: runc
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=percpu,perf_event,referenced_memory,tcp,udp,sched,process,hugetlb
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped
    networks:
      - dhg-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: dhg-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://dhg:${POSTGRES_PASSWORD}@registry-db:5432/dhg_registry?sslmode=disable
    depends_on:
      registry-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - dhg-network

  # P5 T5: loki_store_bytes textfile gauge (compose sidecar in lieu of the
  # systemd du-timer — no sudo tty in the build session; same acceptance).
  # Reads the loki volume read-only, writes a node-exporter textfile metric
  # every 5 minutes. Deletes nothing.
  p5-loki-du:
    image: alpine:3.20
    container_name: dhg-p5-loki-du
    volumes:
      - loki_data:/loki:ro
      - /mnt/4tb/observability/textfile:/textfile
    command:
      - sh
      - -c
      - |
        while true; do
          T=/textfile/loki_store.prom
          if B=$$(du -sb /loki | cut -f1) && [ -n "$$B" ]; then
            printf '# HELP loki_store_bytes Size of the Loki keep-all store volume in bytes.\n# TYPE loki_store_bytes gauge\nloki_store_bytes %s\n' "$$B" > "$$T.tmp"
            mv "$$T.tmp" "$$T"
          else
            echo "p5-loki-du: du failed; keeping previous gauge" >&2
          fi
          i=0; while [ $$i -lt 300 ]; do sleep 1; i=$$((i+1)); done
        done
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.19.0
    container_name: dhg-alloy
    volumes:
      - ./observability/alloy:/etc/alloy:ro
      - alloy_data:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/12345' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dhg-network
    restart: unless-stopped

  dhg-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_LANGGRAPH_API_URL: /api/langgraph
        NEXT_PUBLIC_LANGGRAPH_ASSISTANT_ID: needs_assessment
        NEXT_PUBLIC_REGISTRY_API_URL: http://10.0.0.251:8011
        NEXT_PUBLIC_SECURITY_DEV_MODE: "true"
    container_name: dhg-frontend
    ports:
      - "3000:3000"
    environment:
      - LOGS_CHAT_TOKEN=${LOGS_CHAT_TOKEN:-}
      - REGISTRY_API_URL=http://dhg-registry-api:8000
      - NODE_ENV=production
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - EXPORT_SIGNING_SECRET=${EXPORT_SIGNING_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://0.0.0.0:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dhg-network
    restart: unless-stopped
    labels:
      - "prometheus.io/scrape=false"

  tempo:
    image: grafana/tempo:2.3.1
    container_name: dhg-tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/tempo:/etc/tempo
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/tempo-config.yml
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dhg-network
    restart: unless-stopped

  vs-engine:
    build:
      context: ./services/vs-engine
      dockerfile: Dockerfile
    container_name: dhg-vs-engine
    environment:
      - OLLAMA_BASE_URL=http://dhg-ollama:11434
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8013:8000"
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8000"
      prometheus.io/path: "/metrics"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - dhg-network
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started

  dhg-remediator:
    build:
      context: ./services/remediator
      dockerfile: Dockerfile
    container_name: dhg-remediator
    environment:
      - REGISTRY_URL=http://dhg-registry-api:8000
      - POLL_INTERVAL=30
      - COOLDOWN_SECONDS=600
      - REMEDIATOR_DRY_RUN=${REMEDIATOR_DRY_RUN:-false}
      - LOG_LEVEL=INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      registry-api:
        condition: service_healthy
    mem_limit: 128m
    networks:
      - dhg-network
    restart: unless-stopped

  dhg-memreg-agent:
    build: /home/swebber64/DHG/dhg-memreg
    image: dhg-memreg:daemon
    container_name: dhg-memreg-agent
    network_mode: host
    user: "1000:1000"
    volumes:
      - /home/swebber64/.claude:/home/swebber64/.claude
      - /home/swebber64/DHG:/home/swebber64/DHG
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - REGISTRY_URL=http://10.0.0.251:8011
      - SWEEP_THRESHOLD_TOKENS=50000
      - SWEEP_INTERVAL_SECONDS=30
      - SWEEP_TIMEOUT_SECONDS=180
      - DLQ_MAX_AGE_DAYS=7
      - DLQ_MAX_ENTRIES=1000
      - CLAUDE_PROJECTS_DIR=/home/swebber64/.claude/projects
      - DHG_ROOT=/home/swebber64/DHG
      - MEMREG_RUN_DIR=/home/swebber64/.claude/run
      - METRICS_PORT=8020
      - REGISTRY_SRC_PATH=/home/swebber64/DHG/aifactory3.5/dhgaifactory3.5/registry
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8021/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  dhg-pdf-renderer:
    environment:
      - DATABASE_URL=postgresql://dhg:${POSTGRES_PASSWORD}@registry-db:5432/dhg_registry
      - EXPORTS_DIR=/exports
    volumes:
      - ./registry:/app/registry:ro
    depends_on:
      registry-db:
        condition: service_healthy

  dhg-docs:
    image: nginx:alpine
    container_name: dhg-docs
    ports:
      - "8017:80"
    volumes:
      - ./docs-site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docs-site/build:/usr/share/nginx/html:ro
    networks:
      - dhg-network
    restart: unless-stopped


  dhg-graphify-wiki:
    image: nginx:alpine
    container_name: dhg-graphify-wiki
    ports:
      - "8021:80"
    volumes:
      - /home/swebber64/DHG/portage/graphify-out/wiki:/usr/share/nginx/html:ro
      - ./graphify-wiki/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - dhg-network

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  tempo_data:
  alertmanager_data:
  alloy_data:
