<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#663399"/>
    </marker>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="640" fill="#FAF9F7" rx="8"/>
  <text x="600" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#32374A">RAG Pipeline — Knowledge Search</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#71717A">Open WebUI tool call → Registry hybrid retrieval → grounded answer</text>

  <!-- Step 1 -->
  <rect x="40" y="110" width="200" height="110" rx="10" fill="#fff" stroke="#663399" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="40" y="110" width="200" height="28" rx="10" fill="#663399"/>
  <rect x="40" y="128" width="200" height="10" fill="#663399"/>
  <text x="140" y="129" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">1 · User query</text>
  <text x="140" y="166" text-anchor="middle" font-size="10.5" fill="#333">Model invokes</text>
  <text x="140" y="183" text-anchor="middle" font-size="10.5" fill="#333">search_knowledge()</text>
  <text x="140" y="203" text-anchor="middle" font-size="10" fill="#71717A">POST /api/kb/search</text>

  <!-- Step 2 -->
  <rect x="290" y="110" width="200" height="110" rx="10" fill="#fff" stroke="#663399" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="290" y="110" width="200" height="28" rx="10" fill="#663399"/>
  <rect x="290" y="128" width="200" height="10" fill="#663399"/>
  <text x="390" y="129" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">2 · Embed query</text>
  <text x="390" y="166" text-anchor="middle" font-size="10.5" fill="#333">Ollama nomic-embed-text</text>
  <text x="390" y="183" text-anchor="middle" font-size="10.5" fill="#333">768-dim vector</text>
  <text x="390" y="203" text-anchor="middle" font-size="10" fill="#B91C1C">FTS-only fallback on fail</text>

  <!-- Step 3 -->
  <rect x="540" y="110" width="200" height="110" rx="10" fill="#fff" stroke="#663399" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="540" y="110" width="200" height="28" rx="10" fill="#663399"/>
  <rect x="540" y="128" width="200" height="10" fill="#663399"/>
  <text x="640" y="129" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">3 · Hybrid search</text>
  <text x="640" y="166" text-anchor="middle" font-size="10.5" fill="#333">Per-table FTS + vector</text>
  <text x="640" y="183" text-anchor="middle" font-size="10.5" fill="#333">across 9 KB tables</text>
  <text x="640" y="203" text-anchor="middle" font-size="10" fill="#71717A">parallel, fault-isolated</text>

  <!-- Step 4 -->
  <rect x="790" y="110" width="200" height="110" rx="10" fill="#fff" stroke="#663399" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="790" y="110" width="200" height="28" rx="10" fill="#663399"/>
  <rect x="790" y="128" width="200" height="10" fill="#663399"/>
  <text x="890" y="129" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">4 · RRF fuse</text>
  <text x="890" y="166" text-anchor="middle" font-size="10.5" fill="#333">Reciprocal Rank Fusion</text>
  <text x="890" y="183" text-anchor="middle" font-size="10.5" fill="#333">k = 60</text>
  <text x="890" y="203" text-anchor="middle" font-size="10" fill="#71717A">merge + re-rank</text>

  <!-- Step 5 -->
  <rect x="1010" y="110" width="150" height="110" rx="10" fill="#fff" stroke="#F77E2D" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="1010" y="110" width="150" height="28" rx="10" fill="#F77E2D"/>
  <rect x="1010" y="128" width="150" height="10" fill="#F77E2D"/>
  <text x="1085" y="129" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">5 · TOP_K=5</text>
  <text x="1085" y="166" text-anchor="middle" font-size="10.5" fill="#333">Context injected</text>
  <text x="1085" y="183" text-anchor="middle" font-size="10.5" fill="#333">into model prompt</text>
  <text x="1085" y="203" text-anchor="middle" font-size="10" fill="#71717A">grounded answer</text>

  <line x1="240" y1="165" x2="288" y2="165" stroke="#663399" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="490" y1="165" x2="538" y2="165" stroke="#663399" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="740" y1="165" x2="788" y2="165" stroke="#663399" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="990" y1="165" x2="1008" y2="165" stroke="#663399" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 9 tables -->
  <rect x="40" y="280" width="1120" height="250" rx="12" fill="#EEF2F0" stroke="#32374A" stroke-width="1.5" stroke-dasharray="6 3" filter="url(#sh)"/>
  <text x="60" y="306" font-size="14" font-weight="700" fill="#32374A">9 KB tables — PostgreSQL 15 + pgvector (FTS tsvector + vector columns)</text>
  <g font-size="11" fill="#32374A">
    <rect x="60" y="324" width="250" height="44" rx="6" fill="#fff" stroke="#32374A" stroke-width="1.1"/>
    <text x="185" y="351" text-anchor="middle">doc_pages</text>
    <rect x="325" y="324" width="250" height="44" rx="6" fill="#fff" stroke="#32374A" stroke-width="1.1"/>
    <text x="450" y="351" text-anchor="middle">insights</text>
    <rect x="590" y="324" width="250" height="44" rx="6" fill="#fff" stroke="#32374A" stroke-width="1.1"/>
    <text x="715" y="351" text-anchor="middle">decision_logs</text>
    <rect x="855" y="324" width="250" height="44" rx="6" fill="#fff" stroke="#32374A" stroke-width="1.1"/>
    <text x="980" y="351" text-anchor="middle">ship_sessions</text>

    <rect x="60" y="380" width="250" height="44" rx="6" fill="#fff" stroke="#32374A" stroke-width="1.1"/>
    <text x="185" y="407" text-anchor="middle">agent_sessions</text>
    <rect x="325" y="380" width="250" height="44" rx="6" fill="#fff" stroke="#32374A" stroke-width="1.1"/>
    <text x="450" y="407" text-anchor="middle">corrections</text>
    <rect x="590" y="380" width="250" height="44" rx="6" fill="#fff" stroke="#32374A" stroke-width="1.1"/>
    <text x="715" y="407" text-anchor="middle">dev_changelog</text>
    <rect x="855" y="380" width="250" height="44" rx="6" fill="#fff" stroke="#32374A" stroke-width="1.1"/>
    <text x="980" y="407" text-anchor="middle">bug_fixes</text>

    <rect x="60" y="436" width="250" height="44" rx="6" fill="#fff" stroke="#32374A" stroke-width="1.1"/>
    <text x="185" y="463" text-anchor="middle">deferred_items</text>
  </g>
  <text x="60" y="510" font-size="11" fill="#71717A">Each source searched independently; a failing source is logged and skipped (graceful degradation). Sources filterable via the `sources` param.</text>

  <text x="600" y="582" text-anchor="middle" font-size="12" fill="#71717A">Note: the 3 in-app Open WebUI KBs (DHG Reference, Debug Protocols, DHG Architecture) are a separate store and currently hold 0 documents.</text>
  <text x="600" y="604" text-anchor="middle" font-size="12" fill="#71717A">The Knowledge Search tool above queries the Registry KB (9 tables), which is fully populated — independent of the empty in-app KBs.</text>
</svg>
