<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#663399"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F77E2D"/>
    </marker>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="560" fill="#FAF9F7" rx="8"/>
  <text x="600" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#32374A">Request Flow — Chat with Tool Calls</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#71717A">From browser to grounded answer, including a tool round-trip</text>

  <!-- nodes -->
  <rect x="40" y="120" width="160" height="80" rx="10" fill="#fff" stroke="#663399" stroke-width="1.5" filter="url(#sh)"/>
  <text x="120" y="155" text-anchor="middle" font-size="12" font-weight="600" fill="#32374A">User</text>
  <text x="120" y="175" text-anchor="middle" font-size="10" fill="#71717A">browser (PWA)</text>

  <rect x="250" y="120" width="170" height="80" rx="10" fill="#F3EEF9" stroke="#663399" stroke-width="1.5" filter="url(#sh)"/>
  <text x="335" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#663399">Cloudflare</text>
  <text x="335" y="170" text-anchor="middle" font-size="10" fill="#71717A">Tunnel + Access</text>
  <text x="335" y="186" text-anchor="middle" font-size="10" fill="#71717A">(Google OAuth)</text>

  <rect x="470" y="120" width="200" height="80" rx="10" fill="#FDF1E8" stroke="#F77E2D" stroke-width="1.5" filter="url(#sh)"/>
  <text x="570" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#C2611B">Open WebUI</text>
  <text x="570" y="170" text-anchor="middle" font-size="10" fill="#71717A">selected workspace model</text>
  <text x="570" y="186" text-anchor="middle" font-size="10" fill="#71717A">+ system prompt + RAG</text>

  <rect x="720" y="60" width="200" height="70" rx="10" fill="#EEF2F0" stroke="#32374A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="820" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#32374A">Model backend</text>
  <text x="820" y="110" text-anchor="middle" font-size="10" fill="#71717A">Ollama (local) or DeepSeek</text>

  <rect x="720" y="180" width="200" height="70" rx="10" fill="#fff" stroke="#F77E2D" stroke-width="1.5" filter="url(#sh)"/>
  <text x="820" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#C2611B">DHG tool</text>
  <text x="820" y="230" text-anchor="middle" font-size="10" fill="#71717A">health / kb-search / logs</text>

  <rect x="980" y="180" width="180" height="70" rx="10" fill="#fff" stroke="#32374A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1070" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="#32374A">Registry / Loki</text>
  <text x="1070" y="225" text-anchor="middle" font-size="10" fill="#71717A">:8011 · :3100</text>

  <!-- flows -->
  <line x1="200" y1="160" x2="248" y2="160" stroke="#663399" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="420" y1="160" x2="468" y2="160" stroke="#663399" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="670" y1="150" x2="718" y2="110" stroke="#663399" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="690" y="120" font-size="9.5" fill="#71717A">prompt</text>
  <line x1="670" y1="175" x2="718" y2="210" stroke="#F77E2D" stroke-width="1.6" marker-end="url(#ao)"/>
  <text x="676" y="205" font-size="9.5" fill="#C2611B">tool call</text>
  <line x1="920" y1="215" x2="978" y2="215" stroke="#F77E2D" stroke-width="1.6" marker-end="url(#ao)"/>
  <line x1="980" y1="235" x2="922" y2="245" stroke="#32374A" stroke-width="1.4" stroke-dasharray="4 2" marker-end="url(#a)"/>
  <text x="930" y="262" font-size="9.5" fill="#71717A">JSON result</text>
  <line x1="820" y1="180" x2="820" y2="132" stroke="#32374A" stroke-width="1.4" stroke-dasharray="4 2" marker-end="url(#a)"/>

  <!-- return path -->
  <path d="M 720 95 Q 570 280 200 185" fill="none" stroke="#663399" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="430" y="250" font-size="10.5" fill="#663399">grounded answer streamed back to user</text>

  <!-- legend -->
  <rect x="40" y="360" width="1120" height="160" rx="12" fill="#fff" stroke="#E4E4E7" stroke-width="1.2" filter="url(#sh)"/>
  <text x="60" y="386" font-size="13" font-weight="700" fill="#32374A">Sequence</text>
  <text x="60" y="412" font-size="11.5" fill="#333">1. User sends a message → Cloudflare validates the Access JWT (Google OAuth) before the request reaches the container.</text>
  <text x="60" y="434" font-size="11.5" fill="#333">2. Open WebUI assembles the prompt: DHG system prompt + (optional) RAG context + chat history, then calls the selected model backend.</text>
  <text x="60" y="456" font-size="11.5" fill="#333">3. If the model emits a tool call, Open WebUI executes the DHG tool, which queries the Registry API or Loki and returns JSON.</text>
  <text x="60" y="478" font-size="11.5" fill="#333">4. The tool result is fed back to the model, which produces the final grounded answer.</text>
  <text x="60" y="500" font-size="11.5" fill="#333">5. The answer streams back to the browser. Filters (automemory, download_code_blocks) post-process the turn.</text>
</svg>
