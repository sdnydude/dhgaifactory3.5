  <text x="348" y="372" font-size="10.5" fill="#B91C1C">re-ingest pending)</text>

  <rect x="600" y="238" width="250" height="150" rx="8" fill="#fff" stroke="#F77E2D" stroke-width="1.5" filter="url(#shadow)"/>
