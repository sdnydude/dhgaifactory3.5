  <rect x="60" y="718" width="340" height="150" rx="8" fill="#fff" stroke="#F77E2D" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="60" y="718" width="340" height="26" rx="8" fill="#F77E2D"/>
  <rect x="60" y="736" width="340" height="8" fill="#F77E2D"/>
