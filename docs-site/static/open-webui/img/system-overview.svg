  <text x="618" y="360" font-size="10" fill="#71717A">vision models: health only</text>

  <rect x="870" y="238" width="270" height="150" rx="8" fill="#fff" stroke="#F77E2D" stroke-width="1.5" filter="url(#shadow)"/>
