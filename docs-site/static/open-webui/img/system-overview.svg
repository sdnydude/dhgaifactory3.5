  <text x="448" y="764" font-size="10.5" fill="#333">Log Query tool → LogQL query_range</text>
  <text x="448" y="784" font-size="10.5" fill="#333">query_logs (by container/level/text)</text>
  <text x="448" y="804" font-size="10.5" fill="#333">search_errors (all DHG containers)</text>
  <text x="448" y="824" font-size="10.5" fill="#333">31-day retention · Docker SD labels</text>
  <text x="448" y="848" font-size="10" fill="#71717A">observability/loki/loki-config.yml</text>

  <rect x="800" y="718" width="340" height="150" rx="8" fill="#fff" stroke="#F77E2D" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="800" y="718" width="340" height="26" rx="8" fill="#F77E2D"/>
  <rect x="800" y="736" width="340" height="8" fill="#F77E2D"/>
  <text x="970" y="736" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Registry DB — port 5432</text>
  <text x="818" y="764" font-size="10.5" fill="#333">PostgreSQL 15 + pgvector</text>
  <text x="818" y="784" font-size="10.5" fill="#333">9 KB tables (FTS tsvector + vectors)</text>
  <text x="818" y="804" font-size="10.5" fill="#333">decisions · bug_fixes · insights ·</text>
  <text x="818" y="824" font-size="10.5" fill="#333">deferred_items · ship_sessions · …</text>
