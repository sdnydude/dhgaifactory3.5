  <text x="78" y="764" font-size="10.5" fill="#333">GET /healthz → System Health tool</text>
  <text x="78" y="784" font-size="10.5" fill="#333">POST /api/kb/search → Knowledge Search</text>
  <text x="78" y="804" font-size="10.5" fill="#333">Hybrid RRF over 9 KB tables (k=60)</text>
  <text x="78" y="824" font-size="10.5" fill="#333">Embeds query via Ollama nomic-embed-text</text>
  <text x="78" y="848" font-size="10" fill="#71717A">registry/kb_endpoints.py</text>

  <rect x="430" y="718" width="340" height="150" rx="8" fill="#fff" stroke="#F77E2D" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="430" y="718" width="340" height="26" rx="8" fill="#F77E2D"/>
  <rect x="430" y="736" width="340" height="8" fill="#F77E2D"/>
