  <text x="618" y="284" font-size="10.5" fill="#333">dhg_system_health</text>
  <text x="618" y="302" font-size="10.5" fill="#333">dhg_knowledge_search</text>
  <text x="618" y="320" font-size="10.5" fill="#333">dhg_log_query</text>
