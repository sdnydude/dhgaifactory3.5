  <text x="888" y="284" font-size="10.5" fill="#333">dhg-open-terminal (port 8022)</text>
  <text x="888" y="302" font-size="10.5" fill="#333">server: dhg-open-terminal:8000</text>
  <text x="888" y="320" font-size="10.5" fill="#333">file browser + shell tool</text>
  <text x="888" y="344" font-size="10" fill="#71717A">Admin → Settings →</text>
  <text x="888" y="360" font-size="10" fill="#71717A">Integrations</text>

