  <text x="760" y="512" text-anchor="middle" font-size="10" fill="#71717A">284B / 13B active · 1M ctx · primary</text>
  <rect x="895" y="470" width="255" height="56" rx="8" fill="#fff" stroke="#663399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1022" y="492" text-anchor="middle" font-size="12" font-weight="600" fill="#32374A">deepseek-v4-pro</text>
