<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
