<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#663399"/>
    </marker>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="#FAF9F7" rx="8"/>
  <text x="600" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#32374A">Deployment Topology</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#71717A">g700data1 (10.0.0.251) · Ubuntu 24.04 · RTX 5080 · Docker · network dhgaifactory35_dhg-network</text>

  <!-- internet / cloudflare -->
  <rect x="40" y="95" width="1120" height="90" rx="12" fill="#F3EEF9" stroke="#663399" stroke-width="1.5" stroke-dasharray="6 3" filter="url(#sh)"/>
  <text x="60" y="119" font-size="14" font-weight="700" fill="#663399">EDGE — Cloudflare (SSL termination + Access)</text>
  <rect x="60" y="130" width="330" height="44" rx="8" fill="#fff" stroke="#663399" stroke-width="1.3"/>
  <text x="225" y="152" text-anchor="middle" font-size="11.5" font-weight="600" fill="#32374A">chat.digitalharmonyai.com</text>
  <text x="225" y="168" text-anchor="middle" font-size="10" fill="#71717A">cloudflared.service → localhost:3080</text>
  <rect x="410" y="130" width="330" height="44" rx="8" fill="#fff" stroke="#663399" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="575" y="152" text-anchor="middle" font-size="11.5" fill="#71717A">docs.digitalharmonyai.com → :8017</text>
  <text x="575" y="168" text-anchor="middle" font-size="10" fill="#71717A">dhg-docs (this documentation)</text>

  <!-- host containers -->
  <rect x="40" y="210" width="1120" height="460" rx="12" fill="#EEF2F0" stroke="#32374A" stroke-width="1.5" stroke-dasharray="6 3" filter="url(#sh)"/>
  <text x="60" y="234" font-size="14" font-weight="700" fill="#32374A">HOST — Docker containers on dhgaifactory35_dhg-network</text>

  <!-- open-webui -->
  <rect x="70" y="252" width="300" height="120" rx="8" fill="#fff" stroke="#F77E2D" stroke-width="1.6" filter="url(#sh)"/>
  <rect x="70" y="252" width="300" height="26" rx="8" fill="#F77E2D"/>
  <rect x="70" y="270" width="300" height="8" fill="#F77E2D"/>
  <text x="220" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">dhg-open-webui</text>
  <text x="88" y="298" font-size="10.5" fill="#333">port 3080 · v0.9.6</text>
  <text x="88" y="316" font-size="10.5" fill="#333">chat, RAG, tools, filters</text>
  <text x="88" y="334" font-size="10.5" fill="#333">8 workspace models</text>
  <text x="88" y="356" font-size="10" fill="#71717A">up 10h healthy (2026-06-05)</text>

  <!-- open-terminal -->
  <rect x="400" y="252" width="280" height="120" rx="8" fill="#fff" stroke="#F77E2D" stroke-width="1.4" filter="url(#sh)"/>
  <rect x="400" y="252" width="280" height="26" rx="8" fill="#F77E2D"/>
  <rect x="400" y="270" width="280" height="8" fill="#F77E2D"/>
  <text x="540" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">dhg-open-terminal</text>
  <text x="418" y="298" font-size="10.5" fill="#333">port 8022 · API :8000</text>
  <text x="418" y="316" font-size="10.5" fill="#333">shell + file browser</text>
  <text x="418" y="334" font-size="10.5" fill="#333">Terminal integration</text>
  <text x="418" y="356" font-size="10" fill="#71717A">up 12h (2026-06-05)</text>

  <!-- ollama -->
  <rect x="710" y="252" width="290" height="120" rx="8" fill="#fff" stroke="#32374A" stroke-width="1.4" filter="url(#sh)"/>
  <rect x="710" y="252" width="290" height="26" rx="8" fill="#32374A"/>
  <rect x="710" y="270" width="290" height="8" fill="#32374A"/>
  <text x="855" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">dhg-ollama</text>
  <text x="728" y="298" font-size="10.5" fill="#333">port 11434 · GPU (nvidia)</text>
  <text x="728" y="316" font-size="10.5" fill="#333">gemma4, glm-4.7, devstral,</text>
  <text x="728" y="334" font-size="10.5" fill="#333">qwen3, qwen3-vl, llama-vision</text>
  <text x="728" y="356" font-size="10" fill="#71717A">+ nomic-embed-text</text>

  <!-- registry api -->
  <rect x="70" y="400" width="300" height="110" rx="8" fill="#fff" stroke="#32374A" stroke-width="1.4" filter="url(#sh)"/>
  <rect x="70" y="400" width="300" height="26" rx="8" fill="#32374A"/>
  <rect x="70" y="418" width="300" height="8" fill="#32374A"/>
  <text x="220" y="418" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">dhg-registry-api</text>
  <text x="88" y="446" font-size="10.5" fill="#333">port 8011 · FastAPI</text>
  <text x="88" y="464" font-size="10.5" fill="#333">/healthz · /api/kb/search</text>
  <text x="88" y="482" font-size="10.5" fill="#333">9 KB tables · Prometheus</text>

  <!-- registry db -->
  <rect x="400" y="400" width="280" height="110" rx="8" fill="#fff" stroke="#32374A" stroke-width="1.4" filter="url(#sh)"/>
  <rect x="400" y="400" width="280" height="26" rx="8" fill="#32374A"/>
  <rect x="400" y="418" width="280" height="8" fill="#32374A"/>
  <text x="540" y="418" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">dhg-registry-db</text>
  <text x="418" y="446" font-size="10.5" fill="#333">port 5432</text>
  <text x="418" y="464" font-size="10.5" fill="#333">PostgreSQL 15 + pgvector</text>
  <text x="418" y="482" font-size="10.5" fill="#333">FTS tsvector + vectors</text>

  <!-- loki -->
  <rect x="710" y="400" width="290" height="110" rx="8" fill="#fff" stroke="#32374A" stroke-width="1.4" filter="url(#sh)"/>
  <rect x="710" y="400" width="290" height="26" rx="8" fill="#32374A"/>
  <rect x="710" y="418" width="290" height="8" fill="#32374A"/>
  <text x="855" y="418" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">dhg-loki</text>
  <text x="728" y="446" font-size="10.5" fill="#333">port 3100 · 31-day retention</text>
  <text x="728" y="464" font-size="10.5" fill="#333">Promtail Docker SD ingest</text>
  <text x="728" y="482" font-size="10.5" fill="#333">LogQL query_range</text>

  <!-- cloud deepseek -->
  <rect x="1020" y="400" width="120" height="110" rx="8" fill="#F3EEF9" stroke="#663399" stroke-width="1.4" stroke-dasharray="4 2" filter="url(#sh)"/>
  <text x="1080" y="448" text-anchor="middle" font-size="11" font-weight="600" fill="#663399">DeepSeek</text>
  <text x="1080" y="468" text-anchor="middle" font-size="10" fill="#71717A">cloud API</text>
  <text x="1080" y="484" text-anchor="middle" font-size="9" fill="#71717A">(external)</text>

  <!-- edges -->
  <line x1="220" y1="174" x2="220" y2="252" stroke="#663399" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="370" y1="312" x2="400" y2="312" stroke="#32374A" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="220" y1="372" x2="220" y2="400" stroke="#32374A" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="855" y1="372" x2="540" y2="252" stroke="#32374A" stroke-width="0" />
  <line x1="300" y1="334" x2="710" y2="312" stroke="#32374A" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <line x1="370" y1="455" x2="400" y2="455" stroke="#32374A" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="855" y1="372" x2="855" y2="400" stroke="#32374A" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="1000" y1="312" x2="1020" y2="400" stroke="#663399" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#a)"/>

  <text x="600" y="640" text-anchor="middle" font-size="10.5" fill="#71717A">Note: dhg-open-webui and dhg-open-terminal are deployed outside the repo compose files (managed directly on the host). All other services are repo-defined.</text>
</svg>
