<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" role="img" aria-label="Route ladder: for each marketplace use the highest rung available; the extension is the last resort" style="max-width:100%;height:auto" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="12" fill="#1d2024" stroke="none"><defs><marker id="ah-file" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2024"/></marker><marker id="aa-file" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9601c"/></marker></defs><rect x="0" y="0" width="700" height="370" fill="#ffffff"/><rect x="20" y="20" width="560" height="52" rx="6" fill="none" stroke="#d9601c" stroke-width="1.5"/><text x="34" y="41" font-weight="600" font-size="13" fill="#d9601c">1 · Official open API</text><text x="34" y="60" font-size="11.5">eBay · Reverb · Discogs · Etsy (Seller App) · Mercado Libre MX · HipStamp · Delcampe</text><line x1="300" y1="72" x2="300" y2="86" stroke="#1d2024" stroke-width="1.6" marker-end="url(#ah-file)"/><rect x="20" y="88" width="560" height="52" rx="6" fill="none" stroke="#0f7c7a" stroke-width="1.5"/><text x="34" y="109" font-weight="600" font-size="13" fill="#0f7c7a">2 · Partner program / BD</text><text x="34" y="128" font-size="11.5">FB Partnership · Nextdoor API · Depop (eBay) · OfferUp consent · Craigslist bulk</text><line x1="300" y1="140" x2="300" y2="154" stroke="#1d2024" stroke-width="1.6" marker-end="url(#ah-file)"/><rect x="20" y="156" width="560" height="52" rx="6" fill="none" stroke="#0f7c7a" stroke-width="1.5"/><text x="34" y="177" font-weight="600" font-size="13" fill="#0f7c7a">3 · Ride an approved partner</text><text x="34" y="196" font-size="11.5">eBay → Facebook partner listings · Shopify → Whatnot</text><line x1="300" y1="208" x2="300" y2="222" stroke="#1d2024" stroke-width="1.6" marker-end="url(#ah-file)"/><rect x="20" y="224" width="560" height="52" rx="6" fill="none" stroke="#1d2024" stroke-width="1.5"/><text x="34" y="245" font-weight="600" font-size="13" fill="#1d2024">4 · User posts in the official app</text><text x="34" y="264" font-size="11.5">share-sheet handoff · copy kit (every marketplace, JP/KR included)</text><line x1="300" y1="276" x2="300" y2="290" stroke="#1d2024" stroke-width="1.6" marker-end="url(#ah-file)"/><rect x="20" y="292" width="560" height="52" rx="6" fill="none" stroke="#b3261e" stroke-width="1.5"/><text x="34" y="313" font-weight="600" font-size="13" fill="#b3261e">5 · Assisted extension, risk-tiered</text><text x="34" y="332" font-size="11.5">user presses Post · only where ToS names no tool ban, or with consent</text><text x="600" y="40" font-size="11">try first</text><text x="600" y="330" font-size="11">last resort</text><line x1="640" y1="48" x2="640" y2="316" stroke="#1d2024" stroke-width="1.2" marker-end="url(#ah-file)"/><text x="652" y="180.0" font-size="11" transform="rotate(90 652 180.0)" text-anchor="middle">more ToS risk, less control</text></svg>