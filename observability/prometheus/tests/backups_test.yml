# promtool unit tests for rules.d/backups.yml.
# Run: docker run --rm -v "$PWD/observability/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v2.48.0 test rules /p/tests/backups_test.yml
rule_files:
  - ../rules.d/backups.yml

evaluation_interval: 1m

tests:
  # A target whose most recent attempt is newer than its last success is a failure.
  - interval: 1m
    input_series:
      - series: 'backup_last_attempt_timestamp{name="registry-db"}'
        values: '1000x20'
      - series: 'backup_last_success_timestamp{name="registry-db"}'
        values: '900x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: BackupFailed
        exp_alerts:
          - exp_labels: {severity: high, service: backups, name: registry-db}
            exp_annotations:
              summary: "Last backup attempt of registry-db failed"
              description: "The most recent backup-all.sh attempt for registry-db did not complete (attempt stamp is newer than the last success). The previous good run is still on disk and on the NAS. Read the failure line in ~/.claude/run/backup-all.log; a stopped source container or an unreachable dh40801 are the usual causes."
              runbook_url: "http://10.0.0.251:8017/dhg-ai-factory/runbooks/alerts#backupfailed"

  # A target that has been attempted but has NEVER succeeded (first night failed,
  # new target, dh40801 unreachable from day one) has no success series at all.
  # It must still raise BackupFailed even though another target has succeeded
  # (so absent() on the whole metric is false).
  - interval: 1m
    input_series:
      - series: 'backup_last_attempt_timestamp{name="langfuse-minio"}'
        values: '1000x20'
      - series: 'backup_last_attempt_timestamp{name="registry-db"}'
        values: '1000x20'
      - series: 'backup_last_success_timestamp{name="registry-db"}'
        values: '1001x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: BackupFailed
        exp_alerts:
          - exp_labels: {severity: high, service: backups, name: langfuse-minio}
            exp_annotations:
              summary: "Last backup attempt of langfuse-minio failed"
              description: "The most recent backup-all.sh attempt for langfuse-minio did not complete (attempt stamp is newer than the last success). The previous good run is still on disk and on the NAS. Read the failure line in ~/.claude/run/backup-all.log; a stopped source container or an unreachable dh40801 are the usual causes."
              runbook_url: "http://10.0.0.251:8017/dhg-ai-factory/runbooks/alerts#backupfailed"

  # A healthy target (success newer than attempt) raises nothing.
  - interval: 1m
    input_series:
      - series: 'backup_last_attempt_timestamp{name="registry-db"}'
        values: '1000x20'
      - series: 'backup_last_success_timestamp{name="registry-db"}'
        values: '1001x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: BackupFailed
        exp_alerts: []

  # A target that was backed up but never drilled must raise RestoreDrillStale
  # even while other targets have drill stamps.
  - interval: 1m
    input_series:
      - series: 'backup_last_success_timestamp{name="plane-minio"}'
        values: '1000x20'
      - series: 'backup_last_success_timestamp{name="registry-db"}'
        values: '1000x20'
      - series: 'backup_restore_drill_success_timestamp{name="registry-db"}'
        values: '1000x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: RestoreDrillStale
        exp_alerts:
          - exp_labels: {severity: high, service: backups, name: plane-minio}
            exp_annotations:
              summary: "Restore drill of plane-minio has not passed in 8 days"
              description: "restore-drill.sh has not verified a restore of plane-minio in over 8 days (or never). A backup nobody has restored is a hope, not a backup. Run `doppler run --project dhg-monitoring --config dev -- observability/scripts/restore-drill.sh plane-minio` and read why it fails."
              runbook_url: "http://10.0.0.251:8017/dhg-ai-factory/runbooks/alerts#restoredrillstale"
