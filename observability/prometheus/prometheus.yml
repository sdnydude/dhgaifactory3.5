global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'dhg-ai-factory'
    environment: 'local'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['dhg-alertmanager:9093']

# Load alert rules
rule_files:
  - 'alerts.yml'
  - 'rules.d/*.yml'   # per-host / per-WP rule files (dh40801, gpu, postgres) without editing this file

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Registry API service
  # Static is canonical for this service per AUDIT-2026-09 P1 (decision D-B):
  # docker-sd drop-relabels dhg-registry-api so it is scraped exactly once.
  - job_name: 'registry-api'
    static_configs:
      - targets: ['registry-api:8000']
        labels:
          service: 'registry-api'
    metrics_path: '/metrics'
    scrape_interval: 10s


  # PostgreSQL metrics via postgres-exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'registry-db'
    scrape_interval: 30s

  # The other six Postgres instances, via one multi-target postgres_exporter
  # (REBUILD-PLAN-2026-09 WP4). v0.15.0 serves /probe?target=<host:port/db>
  # &auth_module=<name>; credentials never appear here — they live in the
  # gitignored observability/postgres-exporter/postgres_exporter.yml rendered
  # from Doppler. __param_auth_module is set per target as a static label.
  - job_name: 'postgres-multi'
    metrics_path: /probe
    static_configs:
      - targets: ['dhg-medkb-db:5432/medkb']
        labels: {service: 'medkb-db', __param_auth_module: 'medkb'}
      - targets: ['portage-db:5432/portage']
        labels: {service: 'portage-db', __param_auth_module: 'portage'}
      - targets: ['dhg-eval-db:5432/evalviewer']
        labels: {service: 'eval-db', __param_auth_module: 'eval'}
      - targets: ['dhg-transcribe-db:5432/transcribe']
        labels: {service: 'transcribe-db', __param_auth_module: 'transcribe'}
      - targets: ['dhg-audio-postgres:5432/audio_agent']
        labels: {service: 'audio-postgres', __param_auth_module: 'audio'}
      - targets: ['plane-app-plane-db-1:5432/plane']
        labels: {service: 'plane-db', __param_auth_module: 'plane'}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: dhg-postgres-exporter-multi:9187
    scrape_interval: 30s

  # Node Exporter (host metrics) — uses host network, reachable via dhg-network gateway
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['172.18.0.1:9100']
        labels:
          service: 'node-exporter'
    scrape_interval: 15s

  # GPU metrics — nvidia_gpu_exporter (REBUILD-PLAN-2026-09 WP4, decision D-G).
  # Wraps nvidia-smi; exposes nvidia_smi_utilization_gpu_ratio,
  # nvidia_smi_memory_{used,total}_bytes, nvidia_smi_temperature_gpu, all keyed
  # by GPU uuid.
  - job_name: 'gpu'
    static_configs:
      - targets: ['dhg-gpu-exporter:9835']
        labels:
          service: 'gpu'
    metrics_path: /metrics
    scrape_interval: 30s

  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
    scrape_interval: 30s
    # AUDIT-2026-09 P14: container_network_advance_tcp_stats_total was ~22% of
    # TSDB series and is referenced by no dashboard, alert or query. Dropped at
    # scrape. Samples already stored stay until the 30d retention expires.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_network_advance_tcp_stats_total'
        action: drop

  # VS Engine (Verbalized Sampling)
  # Static is canonical for this service per AUDIT-2026-09 P1 (decision D-B).
  - job_name: 'vs-engine'
    static_configs:
      - targets: ['dhg-vs-engine:8000']
        labels:
          service: 'vs-engine'
    metrics_path: /metrics
    scrape_interval: 15s

  # Session logger. Static is canonical per AUDIT-2026-09 P1 (decision D-B);
  # docker-sd drop-relabels dhg-session-logger below.
  - job_name: 'session-logger'
    static_configs:
      - targets: ['dhg-session-logger:8009']
        labels:
          service: 'session-logger'
    metrics_path: /metrics
    scrape_interval: 15s

  # memreg daemon (compose project dhg-memreg, joined to dhg-network).
  # Static is canonical per AUDIT-2026-09 P1 (decision D-B); docker-sd
  # drop-relabels dhg-memreg-agent below.
  # The job name MUST stay 'memreg': the memreg-daemon Grafana dashboard
  # (uid memreg-daemon) has 13 queries keyed on job="memreg".
  - job_name: 'memreg'
    static_configs:
      - targets: ['dhg-memreg-agent:8020']
        labels:
          service: 'memreg'
    metrics_path: /metrics
    scrape_interval: 15s

  # Remediator (2026-09-05): /metrics added when the re-processing loop was
  # fixed; service lives in the override, so a static job rather than labels.
  - job_name: 'remediator'
    static_configs:
      - targets: ['dhg-remediator:9105']
        labels:
          service: 'remediator'
    metrics_path: /metrics
    scrape_interval: 30s

  # Alertmanager self-metrics (AUDIT-2026-09: previously scraped nowhere).
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['dhg-alertmanager:9093']
        labels:
          service: 'alertmanager'
    metrics_path: /metrics
    scrape_interval: 30s

  # Blackbox exporter self-metrics (probe results come from the blackbox-*
  # jobs below; this job is the exporter's own health). It runs in the
  # separate observability/blackbox compose project, so it fails the
  # docker-sd compose-project keep filter — hence a static job here.
  - job_name: 'blackbox'
    static_configs:
      - targets: ['dhg-blackbox:9115']
        labels:
          service: 'blackbox'
    metrics_path: /metrics
    scrape_interval: 30s

  # cloudflared tunnels (two host systemd units). AUDIT-2026-09 A5.
  # WARNING: this job is DOWN until the units are edited as root. Today both
  # cloudflared processes bind their metrics server to 127.0.0.1 only (ports
  # auto-assigned: 20241 and 20242 are currently listening on loopback), which
  # a container cannot reach. Stephen must add to each unit's ExecStart:
  #   cloudflared.service          -> --metrics 0.0.0.0:20241
  #   cloudflared-portage.service  -> --metrics 0.0.0.0:20242
  # then `systemctl daemon-reload && systemctl restart cloudflared cloudflared-portage`.
  # Until then these two targets report DOWN. This is intentional, not a bug.
  - job_name: 'cloudflared'
    static_configs:
      - targets: ['host.docker.internal:20241', 'host.docker.internal:20242']
        labels:
          service: 'cloudflared'
    metrics_path: /metrics
    scrape_interval: 30s

  # medkb RAG-as-a-Service
  - job_name: 'medkb'
    static_configs:
      - targets: ['dhg-medkb-api:8015']
    metrics_path: /metrics
    scrape_interval: 15s

  # audio-agent (REBUILD-PLAN-2026-09 WP4). It belongs to compose project
  # dhg-audio-agent (config at langgraph_workflows/dhg-agents-cloud/src/
  # dhg-audio-agent/docker-compose.yml) and is attached only to
  # dhg-audio-agent_audio-net, so neither a docker-sd label on it (the SD job
  # keeps only projects dhgaifactory35|dhg-memreg) nor container DNS would work
  # from Prometheus. Scraped over the published host port instead: container
  # 8000 -> host 8101, serving prometheus_client /metrics.
  - job_name: 'audio-agent'
    static_configs:
      - targets: ['10.0.0.251:8101']
        labels:
          service: 'audio-agent'
    metrics_path: /metrics
    scrape_interval: 30s

  # Portage API (project `portage`, joined to dhg-network). Serves TLS on 8016
  # with a self-signed cert -> https + skip verify. Not picked up by docker-sd
  # because that job keeps only compose projects dhgaifactory35|dhg-memreg.
  - job_name: 'portage-api'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['portage-api:8016']
        labels:
          service: 'portage-api'
    metrics_path: /metrics
    scrape_interval: 15s

  # Blackbox synthetic probes (observability/blackbox/). Ollama exposes no
  # /metrics; probe it two ways: container DNS (is it serving?) and the LAN
  # published port (is the host port mapping alive? — this is the path Portage
  # Porter uses, and the one that silently died on 2026-08-15, bug-fix ef492f28).
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://dhg-ollama:11434/api/tags
        labels: {service: 'ollama', path: 'container'}
      - targets:
          - http://10.0.0.251:11434/api/tags
        labels: {service: 'ollama', path: 'lan'}
      # Uptime probes for the three UIs with no /metrics of their own
      # (REBUILD-PLAN-2026-09 WP4). dhg-frontend:3000/ answers 307 -> /projects;
      # http_2xx follows redirects, so the probe sees the final 200.
      - targets:
          - http://dhg-frontend:3000/
        labels: {service: 'frontend', path: 'container'}
      - targets:
          - http://dhg-open-webui:8080/
        labels: {service: 'open-webui', path: 'container'}
      - targets:
          - http://dhg-grafana:3000/api/health
        labels: {service: 'grafana', path: 'container'}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: dhg-blackbox:9115
    scrape_interval: 30s

  - job_name: 'blackbox-https'
    metrics_path: /probe
    params:
      module: [http_2xx_insecure_tls]
    static_configs:
      - targets:
          - https://portage-api:8016/health
        labels: {service: 'portage-api', path: 'container'}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: dhg-blackbox:9115
    scrape_interval: 30s

  # Public hostname behind Cloudflare Access. Separate job because it needs the
  # http_cf_access module (302 accepted, redirect not followed). Read the module
  # comment in observability/blackbox/blackbox.yml: a success here proves the
  # Cloudflare edge answers for the hostname and the Access policy is attached —
  # it does NOT prove the cloudflared tunnel or the registry app, because Access
  # rejects the unauthenticated request at the edge and never reaches the origin.
  - job_name: 'blackbox-public'
    metrics_path: /probe
    params:
      module: [http_cf_access]
    static_configs:
      - targets:
          - https://registry.digitalharmonyai.com/health
        labels: {service: 'registry-public', path: 'public'}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: dhg-blackbox:9115
    scrape_interval: 30s

  # Docker Service Discovery — auto-discovers containers with
  # prometheus.io/scrape=true label. Add these Docker labels to any
  # service to opt in:
  #   labels:
  #     prometheus.io/scrape: "true"
  #     prometheus.io/port: "8000"
  #     prometheus.io/path: "/metrics"
  - job_name: 'docker-sd'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: label
            values: ["prometheus.io/scrape=true"]
    relabel_configs:
      # AUDIT-2026-09 P1 / decision D-B: these containers have canonical static
      # jobs above. Drop them here so each is scraped exactly once and the
      # series carry stable instance labels instead of churning container IPs.
      - source_labels: [__meta_docker_container_name]
        regex: '^/?(dhg-registry-api|dhg-vs-engine|dhg-session-logger|dhg-memreg-agent)$'
        action: drop
      - source_labels: [__meta_docker_container_label_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        regex: "dhgaifactory35|dhg-memreg"
        action: keep
      - source_labels: [__meta_docker_network_ip, __meta_docker_container_label_prometheus_io_port]
        separator: ':'
        target_label: __address__
      - source_labels: [__meta_docker_container_name]
        regex: /(.+)
        target_label: container
      # (The former /dhg-memreg-agent -> job="memreg" rewrite was removed with
      # the drop rule above; memreg now has a canonical static job.)
      - source_labels: [__meta_docker_container_label_prometheus_io_path]
        target_label: __metrics_path__
        regex: (.+)

  # P5: Loki self-metrics (T5, ruling e)
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # P5: Alloy self-metrics (T5, ruling e)
  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']

  # --- file_sd jobs: targets live in targets/*.json and are picked up without a restart.
  # Added 2026-09-04 (rebuild plan WP5) so the dh40801 observability agent can be wired
  # from its own files. Empty target files are valid.
  - job_name: 'node-exporter-dh40801'
    file_sd_configs:
      - files: ['/etc/prometheus/targets/dh40801-node.json']
        refresh_interval: 1m
  - job_name: 'cadvisor-dh40801'
    file_sd_configs:
      - files: ['/etc/prometheus/targets/dh40801-cadvisor.json']
        refresh_interval: 1m
  - job_name: 'blackbox-langfuse'
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/dh40801-probes.json']
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: dhg-blackbox:9115
