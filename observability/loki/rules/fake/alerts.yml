# DHG AI Factory — Loki ruler alert rules
#
# Severity taxonomy is shared with observability/prometheus/alerts.yml:
#   critical / high -> registry webhook (auto-creates an incident) + Telegram
#   warning         -> Telegram only (the registry webhook skips non-critical/high)
# No other severity value may be used here.
#
# Every rule carries `for:`, `summary`, `description`, and a `runbook_url`
# anchored at http://10.0.0.251:8017/dhg-ai-factory/runbooks/alerts.

groups:
  - name: dhg-log-alerts
    rules:
      # dhg-node-exporter is excluded: its thermal_zone collector emits ~708K
      # error lines/day, which on its own kept this alert permanently firing
      # and made the whole log-alert group worthless. The exclusion is a
      # workaround, not the fix — the real fix is adding
      # `--no-collector.thermal_zone` to the node-exporter command in
      # docker-compose.override.yml (pending Stephen; command cannot be
      # overridden from docker-compose.yml). Remove this exclusion once that
      # flag is in place.
      - alert: HighErrorRate
        expr: |
          sum(count_over_time({job="dhg-ai-factory", level=~"error|fatal|critical|ERROR|FATAL|CRITICAL", container!="dhg-node-exporter"}[5m])) > 50
        for: 5m
        labels:
          severity: warning
          source: loki
        annotations:
          summary: "High error rate in logs ({{ $value }} errors in 5m)"
          description: "More than 50 error-level log lines across all containers (excluding dhg-node-exporter thermal_zone noise) in the last 5 minutes."
          runbook_url: "http://10.0.0.251:8017/dhg-ai-factory/runbooks/alerts#higherrorrate"

      # Same dhg-node-exporter exclusion as HighErrorRate above — see that
      # comment for the thermal_zone root cause and the pending real fix.
      - alert: ContainerErrorSpike
        expr: |
          sum by (container) (count_over_time({job="dhg-ai-factory", level=~"error|fatal|critical|ERROR|FATAL|CRITICAL", container!="dhg-node-exporter"}[5m])) > 20
        for: 2m
        labels:
          severity: warning
          source: loki
        annotations:
          summary: "Container {{ $labels.container }} error spike ({{ $value }} errors in 5m)"
          description: "A single container is producing more than 20 errors in 5 minutes, indicating a potential service issue. dhg-node-exporter is excluded as known thermal_zone noise."
          runbook_url: "http://10.0.0.251:8017/dhg-ai-factory/runbooks/alerts#containererrorspike"

      - alert: PostgresFatalError
        expr: |
          count_over_time({job="dhg-ai-factory", container="dhg-registry-db", level=~"fatal|panic|FATAL|PANIC"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          source: loki
          service: registry-db
        annotations:
          summary: "PostgreSQL FATAL/PANIC error detected"
          description: "A FATAL or PANIC level error was logged by the registry database. Immediate investigation required."
          runbook_url: "http://10.0.0.251:8017/dhg-ai-factory/runbooks/alerts#postgresfatalerror"

      - alert: NoLogsFromRegistryApi
        expr: |
          absent_over_time({job="dhg-ai-factory", container="dhg-registry-api"}[10m])
        for: 5m
        labels:
          severity: warning
          source: loki
          service: registry-api
        annotations:
          summary: "No logs received from registry-api for 10+ minutes"
          description: "The registry API container has not emitted any logs. It may be down, or Alloy may have lost connectivity to Loki."
          runbook_url: "http://10.0.0.251:8017/dhg-ai-factory/runbooks/alerts#nologsfromregistryapi"

      # P5 T8: raw secret shapes surviving redaction = redaction-failure signal.
      # Detects JWT/Doppler token shapes in STORED lines (post-redaction) —
      # never matches the [REDACTED*] markers themselves.
      - alert: SecretLeakDetected
        expr: |
          sum by (container) (count_over_time({job="dhg-ai-factory"} |~ `eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}|dp\.(?:st|ct|pt)\.[A-Za-z0-9_-]{10,}` [5m])) > 0
        for: 0m
        labels:
          severity: critical
          source: loki
        annotations:
          summary: "Raw secret shape stored in logs ({{ $labels.container }})"
          description: "A JWT or Doppler token shape reached the log store unredacted from container {{ $labels.container }}. Rotate the credential FIRST; never paste the matching line anywhere. Then fix the redaction stage and run the seeded-secret proof."
          runbook_url: "http://10.0.0.251:8017/dhg-ai-factory/runbooks/alerts#secretleakdetected"
