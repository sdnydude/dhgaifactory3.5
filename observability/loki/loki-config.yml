# Loki 3.7 config — P5 log program (2026-08-25).
# Keep-all directive (operator 2026-08-23): NO automatic deletion anywhere.
#   - retention_period: 0  = infinite retention, stated on purpose
#   - compactor runs index compaction ONLY (no retention keys)
#   - deletion is operator-only via the documented runbook procedure
# Schema is ADDITIVE: the v11 boltdb-shipper period keeps all pre-2026-08-26
# chunks/index readable; tsdb/v13 takes over for data from the UTC cutover.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h
    # P5 cutover — 2026-08-26 00:00 UTC (dates in `from` activate at UTC midnight)
    - from: 2026-08-26
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: tsdb_index_
        period: 24h

storage_config:
  # Existing pre-cutover index — paths match the live volume layout (verified).
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

compactor:
  working_directory: /loki/compactor
  # retention_enabled deliberately ABSENT (defaults false) — index compaction only.

query_range:
  parallelise_shardable_queries: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

frontend:
  max_outstanding_per_tenant: 2048
  compress_responses: true

query_scheduler:
  max_outstanding_requests_per_tenant: 2048

limits_config:
  retention_period: 0  # keep-all: infinite retention, explicit
  # Label parity with the promtail-era baseline: Loki 3.x otherwise auto-adds
  # a service_name label to every stream (discover_service_name default).
  discover_service_name: []
  allow_structured_metadata: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_parallelism: 32
  max_query_series: 5000

ruler:
  storage:
    # Nested form is the OPERATIVE one in 3.7 without Thanos objstore —
    # top-level ruler_storage is ignored (boot warning proved it, 2026-08-25).
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://dhg-alertmanager:9093
  # Alertmanager v0.27 removed the v1 API — without this every ruler
  # notification 410s. Measured live 2026-08-25 before the fix:
  # cortex_prometheus_notifications_dropped_total{user="dhg-ai-factory"}=13652
  # (registry insight bd752a8f). Prod fix, P5 T2.
  enable_alertmanager_v2: true
  ring:
    kvstore:
      store: inmemory
  enable_api: true
